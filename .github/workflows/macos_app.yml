name: macOS app

# Builds the self-contained Krokiet binaries and uploads each Krokiet.app zip.
# Does not publish a GitHub release. CLI, GTK, and HEIF/AVIF builds are omitted.
on:
  workflow_dispatch:
  push:
    branches: [macos-app-bundle]

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup env
        run: |
          ARCHNAME=$([ "${{ runner.arch }}" = "ARM64" ] && echo arm64 || echo x86_64)
          echo "ARCHNAME=$ARCHNAME" >> "$GITHUB_ENV"

      - name: Setup rust version
        run: rustup default 1.94.1

      - name: Install icon rasterizer
        run: brew install librsvg

      - name: Build Krokiet
        run: |
          cargo build --release --bin krokiet
          mv target/release/krokiet "mac_krokiet_${ARCHNAME}"
          cargo build --release --bin krokiet --no-default-features --features "winit_skia_vulkan,winit_software"
          mv target/release/krokiet "mac_krokiet_skia_vulkan_${ARCHNAME}"
          cargo build --release --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/release/krokiet "mac_krokiet_femtovg_wgpu_${ARCHNAME}"

      - name: Package Krokiet.app
        run: |
          bash misc/pack_macos_app.sh "mac_krokiet_${ARCHNAME}" "mac_krokiet_${ARCHNAME}.app.zip"
          bash misc/pack_macos_app.sh "mac_krokiet_skia_vulkan_${ARCHNAME}" "mac_krokiet_skia_vulkan_${ARCHNAME}.app.zip"
          bash misc/pack_macos_app.sh "mac_krokiet_femtovg_wgpu_${ARCHNAME}" "mac_krokiet_femtovg_wgpu_${ARCHNAME}.app.zip"

      - name: Upload Krokiet.app
        uses: actions/upload-artifact@v6
        with:
          name: Krokiet-${{ env.ARCHNAME }}
          path: |
            mac_krokiet_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_skia_vulkan_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}.app.zip
          if-no-files-found: error
