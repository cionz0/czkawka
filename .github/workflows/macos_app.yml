name: macOS app

# Builds current macOS Krokiet binaries and uploads a double-clickable .app zip for each.
# Skips the deprecated GTK GUI and the deprecated macOS OpenGL (default femtovg) build.
# Does not publish a GitHub release. The CLI is not built here.
on:
  workflow_dispatch:
  push:
    branches: [macos-app-bundle]

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup env
        run: |
          ARCHNAME=$([ "${{ runner.arch }}" = "ARM64" ] && echo arm64 || echo x86_64)
          echo "ARCHNAME=$ARCHNAME" >> "$GITHUB_ENV"

      - name: Setup rust version
        run: rustup default 1.94.1

      - name: Install libraries
        run: brew install libheif libavif dav1d librsvg

      - name: Build GUI binaries
        run: |
          set -eu
          export LIBRARY_PATH="${LIBRARY_PATH:-}:$(brew --prefix)/lib"
          A="${ARCHNAME}"
          cargo build --release -p krokiet --no-default-features --features "winit_skia_vulkan,winit_software"
          mv target/release/krokiet "mac_krokiet_skia_vulkan_${A}"
          cargo build --release -p krokiet --no-default-features --features "femtovg_wgpu"
          mv target/release/krokiet "mac_krokiet_femtovg_wgpu_${A}"
          cargo build --release -p krokiet --no-default-features --features "winit_femtovg,winit_skia_opengl,winit_skia_vulkan,winit_software,femtovg_wgpu"
          mv target/release/krokiet "mac_krokiet_all_backends_${A}"
          cargo build --release -p krokiet --no-default-features --features "winit_skia_vulkan,winit_software,heif,libavif"
          mv target/release/krokiet "mac_krokiet_skia_vulkan_heif_avif_${A}"
          cargo build --release -p krokiet --no-default-features --features "femtovg_wgpu,heif,libavif"
          mv target/release/krokiet "mac_krokiet_heif_avif_femtovg_wgpu_${A}"
          cargo build --release -p krokiet --no-default-features --features "winit_femtovg,winit_skia_opengl,winit_skia_vulkan,winit_software,femtovg_wgpu,heif,libavif"
          mv target/release/krokiet "mac_krokiet_heif_avif_all_backends_${A}"

      - name: Package macOS apps
        run: |
          set -eu
          pack() {
            bash misc/pack_macos_app.sh "$1" "$1.app.zip" "$2" "$3"
          }
          A="${ARCHNAME}"
          pack "mac_krokiet_skia_vulkan_${A}" "Krokiet Skia Vulkan" "pl.Qarmin.Krokiet.SkiaVulkan"
          pack "mac_krokiet_femtovg_wgpu_${A}" "Krokiet femtovg wgpu" "pl.Qarmin.Krokiet.FemtovgWgpu"
          pack "mac_krokiet_all_backends_${A}" "Krokiet All Backends" "pl.Qarmin.Krokiet.AllBackends"
          pack "mac_krokiet_skia_vulkan_heif_avif_${A}" "Krokiet Skia Vulkan HEIF AVIF" "pl.Qarmin.Krokiet.SkiaVulkan.HeifAvif"
          pack "mac_krokiet_heif_avif_femtovg_wgpu_${A}" "Krokiet femtovg wgpu HEIF AVIF" "pl.Qarmin.Krokiet.FemtovgWgpu.HeifAvif"
          pack "mac_krokiet_heif_avif_all_backends_${A}" "Krokiet All Backends HEIF AVIF" "pl.Qarmin.Krokiet.AllBackends.HeifAvif"

      - name: Upload macOS apps
        uses: actions/upload-artifact@v6
        with:
          name: macos-apps-${{ env.ARCHNAME }}
          path: |
            mac_krokiet_skia_vulkan_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_all_backends_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_skia_vulkan_heif_avif_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}.app.zip
            mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }}.app.zip
          if-no-files-found: error
